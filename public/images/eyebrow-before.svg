<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Fundo tom de pele quente neutro com iluminação suave de estúdio -->
  <defs>
    <radialGradient id="skinGlowBefore" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#EEDFD0" />
      <stop offset="60%" stop-color="#DECBBA" />
      <stop offset="100%" stop-color="#CBB5A1" />
    </radialGradient>
    <linearGradient id="skinTexture" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08" />
    </linearGradient>
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#skinGlowBefore)" />
  <rect width="800" height="500" fill="url(#skinTexture)" />

  <!-- Marca d'água / etiqueta estilizada -->
  <g opacity="0.35">
    <text x="40" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#6A5545">
      ESTUDO DE CASO • ANTES
    </text>
    <text x="40" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8C7462">
      Falhas na cauda, desnível e rarefação nos pelos
    </text>
  </g>

  <!-- Pálpebra e contorno sutil dos olhos para contextualização anatômica -->
  <path d="M120 380 Q 320 310, 520 390" stroke="#B39782" stroke-width="2" fill="none" opacity="0.35" />
  <path d="M160 360 Q 320 325, 480 370" stroke="#CBB5A1" stroke-width="1.5" fill="none" opacity="0.4" />

  <!-- Base da sobrancelha antes (esparsa, com falhas e sem preenchimento na cauda) -->
  <g stroke="#3D2E24" stroke-linecap="round" opacity="0.6">
    <!-- Início ralo -->
    <path d="M180 250 Q185 220 190 200" stroke-width="2" />
    <path d="M195 255 Q198 225 202 205" stroke-width="2.2" />
    <path d="M210 252 Q214 228 220 208" stroke-width="2" />
    <path d="M225 258 Q230 230 236 210" stroke-width="2.4" />
    
    <!-- Corpo com falha evidente no meio -->
    <path d="M245 255 Q255 235 268 215" stroke-width="2" />
    <path d="M260 258 Q272 238 285 218" stroke-width="2.3" />
    <!-- Buraco / Falha intencional entre 280 e 340 -->
    <path d="M300 250 Q305 242 312 235" stroke-width="1.5" opacity="0.3" />
    
    <path d="M340 248 Q355 232 372 222" stroke-width="2.2" />
    <path d="M358 250 Q375 235 392 226" stroke-width="2" />
    <path d="M375 254 Q395 240 415 232" stroke-width="2.5" />
    
    <!-- Cauda curta e sumindo -->
    <path d="M395 256 Q415 246 435 242" stroke-width="1.8" />
    <path d="M415 260 Q430 252 445 250" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- Tag de status -->
  <g transform="translate(620, 40)">
    <rect width="140" height="34" rx="17" fill="#24262C" opacity="0.85" />
    <text x="70" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      ANTES
    </text>
  </g>
</svg>
