<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <rect width="600" height="450" fill="#181A20" />
  <circle cx="300" cy="225" r="220" fill="url(#lipGlow)" opacity="0.18" />
  <!-- Contorno anatômico de lábios refinados (Revitalização & Neutralização) -->
  <g transform="translate(160, 140)">
    <!-- Lábio Superior com Arco do Cupido sutil -->
    <path d="M20 70 C 80 40, 110 32, 140 48 C 170 32, 200 40, 260 70 C 210 78, 170 75, 140 78 C 110 75, 70 78, 20 70 Z" 
          fill="url(#lipGradient)" opacity="0.85" />
    <!-- Lábio Inferior com volume suave -->
    <path d="M20 70 C 60 115, 120 135, 140 135 C 160 135, 220 115, 260 70 C 210 75, 160 78, 140 78 C 120 78, 70 75, 20 70 Z" 
          fill="url(#lipGradientLower)" opacity="0.9" />
    <!-- Brilho / Highlight de hidratação -->
    <ellipse cx="140" cy="98" rx="42" ry="12" fill="#FFFFFF" opacity="0.25" filter="url(#glowHighlight)" />
  </g>
  <text x="300" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#E5C399" text-anchor="middle">
    REVITALIZAÇÃO &amp; NEUTRALIZAÇÃO LABIAL
  </text>
  <defs>
    <radialGradient id="lipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C27D72" />
      <stop offset="100%" stop-color="#C27D72" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lipGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D78A80" />
      <stop offset="100%" stop-color="#B8655A" />
    </linearGradient>
    <linearGradient id="lipGradientLower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8655A" />
      <stop offset="100%" stop-color="#CA756A" />
    </linearGradient>
    <filter id="glowHighlight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>
</svg>
